<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Publisher & Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300">
    <div id="app" class="min-h-full flex flex-col">
        <!-- Navigation Header -->
        <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-tight">GitHub Stories</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Publish & Read Anywhere</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="router.navigate('studio')" class="hidden sm:inline-flex items-center space-x-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl transition-all shadow-sm">
                    <i data-lucide="pen-tool" class="w-4 h-4"></i>
                    <span>Publish Story</span>
                </button>
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </header>

        <!-- Main View Container -->
        <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            <!-- Dynamically injected views -->
        </main>

        <!-- Footer -->
        <footer class="border-t border-slate-200 dark:border-slate-800 py-6 px-6 text-center text-sm text-slate-500 dark:text-slate-400">
            <p>Built for GitHub publishing. Ready for static hosting on GitHub Pages!</p>
        </footer>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        // --- Mock Database / State ---
        let state = {
            currentView: 'home', // 'home', 'reader', 'studio'
            activeStoryId: null,
            activeChapterIdx: 0,
            readerSettings: {
                font: 'serif',
                size: 'text-lg',
                theme: 'light' // light, dark, sepia
            },
            stories: [
                {
                    id: 'story-1',
                    title: 'The Neon Chronomancer',
                    genre: 'Sci-Fi / Cyberpunk',
                    cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=800',
                    synopsis: 'In a city where time can be traded like cryptocurrency, one rogue operator discovers a glitch that could reset humanity\'s clock.',
                    author: 'Alex Rivers',
                    date: 'May 14, 2026',
                    chapters: [
                        {
                            title: 'Chapter 1: Tick-Tock Neon',
                            content: `The rain in Neo-London didn't fall down; it drifted sideways, caught in the updrafts of the skyscraper thrusters. Kael adjusted his collar, feeling the steady, rhythmic pulse of his chronometer implant against his jugular.\n\n"Three hours remaining," the synthetic voice whispered in his inner ear. In this district, life literally had an expiration date.\n\nHe pulled his hood lower as a patrol drone swept its blue sensor beam across the alleyway. He clutched the encrypted drive in his pocket—the one containing the master algorithm that could liberate stolen time from the Central Vault.`
                        },
                        {
                            title: 'Chapter 2: The Quantum Broker',
                            content: `The back room of the obsidian lounge smelled of ozone and synthetic jasmine. Vesper sat behind a desk carved from a single slab of obsidian, her cybernetic fingers clicking rhythmically against a holographic ledger.\n\n"You're late, Kael," she said without looking up. "And lateness is a luxury few chronomancers can afford."\n\n"Traffic on the upper tier was congested," Kael replied smoothly, sliding the drive across the metallic surface. "Do you have the access codes or not?"`
                        }
                    ]
                },
                {
                    id: 'story-2',
                    title: 'Echoes of the Whispering Woods',
                    genre: 'Fantasy / Adventure',
                    cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&q=80&w=800',
                    synopsis: 'Legends say the trees remember every word ever spoken beneath their boughs. When a young apprentice listens too closely, she hears a warning.',
                    author: 'Lyra Vance',
                    date: 'April 29, 2026',
                    chapters: [
                        {
                            title: 'Prologue: The First Leaf',
                            content: `The forest did not sleep. Even in the dead of winter, when frost glazed the needles of the ancient pines, a low murmur vibrated through the damp earth.\n\nElianora pressed her palm against the rugged bark of the Great Willow. She closed her eyes and breathed in the scent of damp moss and rain-soaked loam. Immediately, the whispers began—voices like dry leaves skittering across cobblestones.\n\n*Turn back, child. The roots remember what the realm has forgotten.*`
                        }
                    ]
                }
            ]
        };

        // --- Router & View Rendering ---
        const router = {
            navigate: function(view, storyId = null, chapterIdx = 0) {
                state.currentView = view;
                if (storyId) state.activeStoryId = storyId;
                if (chapterIdx !== undefined) state.activeChapterIdx = chapterIdx;
                window.scrollTo(0, 0);
                render();
            }
        };

        function render() {
            const container = document.getElementById('main-content');
            lucide.createIcons();

            if (state.currentView === 'home') {
                container.innerHTML = renderHomeView();
            } else if (state.currentView === 'reader') {
                container.innerHTML = renderReaderView();
            } else if (state.currentView === 'studio') {
                container.innerHTML = renderStudioView();
            }
            lucide.createIcons();
        }

        // --- View Templates ---
        function renderHomeView() {
            return `
                <div class="space-y-8">
                    <!-- Hero Banner -->
                    <div class="relative rounded-3xl overflow-hidden bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 text-white p-8 sm:p-12 shadow-xl">
                        <div class="relative z-10 max-w-2xl space-y-4">
                            <span class="px-3 py-1 bg-indigo-500/30 border border-indigo-400/30 rounded-full text-xs font-semibold tracking-wide uppercase text-indigo-200">Open Source Publishing</span>
                            <h2 class="text-3xl sm:text-5xl font-extrabold tracking-tight">Publish Your Stories Directly from GitHub</h2>
                            <p class="text-slate-300 text-base sm:text-lg">Share your serial novels, sci-fi epics, and fantasy adventures with the world through a clean, distraction-free reading experience.</p>
                            <div class="pt-2 flex flex-wrap gap-4">
                                <button onclick="router.navigate('studio')" class="px-6 py-3 bg-white text-slate-900 font-semibold rounded-xl hover:bg-slate-100 transition shadow-lg">Start Writing</button>
                                <a href="https://github.com" target="_blank" class="px-6 py-3 bg-indigo-700/60 hover:bg-indigo-700 text-white font-semibold rounded-xl border border-indigo-400/30 transition flex items-center space-x-2">
                                    <i data-lucide="github" class="w-5 h-5"></i>
                                    <span>View on GitHub</span>
                                </a>
                            </div>
                        </div>
                        <div class="absolute right-0 bottom-0 opacity-10 translate-x-10 translate-y-10 pointer-events-none">
                            <i data-lucide="book-open" class="w-96 h-96"></i>
                        </div>
                    </div>

                    <!-- Story Catalog -->
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <h3 class="text-2xl font-bold tracking-tight">Explore Stories</h3>
                            <span class="text-sm text-slate-500 dark:text-slate-400">${state.stories.length} Published Works</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${state.stories.map(story => `
                                <div onclick="router.navigate('reader', '${story.id}', 0)" class="group bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm hover:shadow-xl hover:border-indigo-500/50 transition-all duration-300 cursor-pointer flex flex-col">
                                    <div class="h-48 overflow-hidden relative">
                                        <img src="${story.cover}" alt="${story.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                        <span class="absolute top-3 left-3 px-3 py-1 bg-black/60 backdrop-blur-md text-white text-xs font-medium rounded-full">${story.genre}</span>
                                    </div>
                                    <div class="p-6 flex-1 flex flex-col justify-between space-y-4">
                                        <div class="space-y-2">
                                            <h4 class="font-bold text-xl group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">${story.title}</h4>
                                            <p class="text-sm text-slate-600 dark:text-slate-400 line-clamp-2">${story.synopsis}</p>
                                        </div>
                                        <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                                            <span>By ${story.author}</span>
                                            <span>${story.chapters.length} Chapters</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReaderView() {
            const story = state.stories.find(s => s.id === state.activeStoryId);
            if (!story) return `<div class="text-center py-20">Story not found. <button onclick="router.navigate('home')" class="text-indigo-600 underline">Return Home</button></div>`;
            const chapter = story.chapters[state.activeChapterIdx] || story.chapters[0];

            return `
                <div class="max-w-4xl mx-auto space-y-8 pb-16">
                    <!-- Reader Toolbar -->
                    <div class="flex items-center justify-between bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm sticky top-20 z-40">
                        <button onclick="router.navigate('home')" class="flex items-center space-x-2 text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-indigo-600">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            <span>Back to Library</span>
                        </button>
                        <div class="flex items-center space-x-3">
                            <button onclick="openChapterSelector('${story.id}')" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 text-xs font-semibold rounded-lg hover:bg-indigo-50 dark:hover:bg-slate-700 transition">
                                ${chapter.title}
                            </button>
                            <button onclick="openSettingsModal()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">
                                <i data-lucide="sliders" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Story Header -->
                    <div class="text-center space-y-3 py-6">
                        <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">${story.genre}</span>
                        <h2 class="text-3xl sm:text-4xl font-bold font-serif">${story.title}</h2>
                        <p class="text-slate-500 text-sm">Written by ${story.author}</p>
                    </div>

                    <!-- Chapter Content Box -->
                    <article class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-8 sm:p-12 shadow-sm space-y-6">
                        <h3 class="text-2xl font-bold border-b border-slate-100 dark:border-slate-800 pb-4 font-serif">${chapter.title}</h3>
                        <div class="prose dark:prose-invert max-w-none ${state.readerSettings.font === 'serif' ? 'font-serif' : 'font-sans'} ${state.readerSettings.size} leading-relaxed text-slate-700 dark:text-slate-300 whitespace-pre-line">
                            ${chapter.content}
                        </div>
                    </article>

                    <!-- Chapter Navigation Footer -->
                    <div class="flex items-center justify-between pt-6">
                        <button onclick="navigateChapter(-1)" ${state.activeChapterIdx === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 text-sm font-medium"' : 'class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800"'}>
                            Previous Chapter
                        </button>
                        <span class="text-sm text-slate-500">Chapter ${state.activeChapterIdx + 1} of ${story.chapters.length}</span>
                        <button onclick="navigateChapter(1)" ${state.activeChapterIdx === story.chapters.length - 1 ? 'disabled class="opacity-40 cursor-not-allowed px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 text-sm font-medium"' : 'class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700"'}>
                            Next Chapter
                        </button>
                    </div>
                </div>
            `;
        }

        function renderStudioView() {
            return `
                <div class="max-w-3xl mx-auto space-y-8 pb-16">
                    <div class="flex items-center justify-between">
                        <h2 class="text-3xl font-bold tracking-tight">Publish New Story</h2>
                        <button onclick="router.navigate('home')" class="text-sm text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">Cancel</button>
                    </div>

                    <form onsubmit="handlePublish(event)" class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-8 shadow-sm space-y-6">
                        <div class="space-y-2">
                            <label class="block text-sm font-semibold">Story Title</label>
                            <input type="text" id="pub-title" required placeholder="e.g., Chronicles of the Void" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="block text-sm font-semibold">Author Name</label>
                                <input type="text" id="pub-author" required placeholder="Your Name or Handle" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div class="space-y-2">
                                <label class="block text-sm font-semibold">Genre</label>
                                <input type="text" id="pub-genre" required placeholder="Sci-Fi, Fantasy, Mystery..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-semibold">Cover Image URL</label>
                            <input type="url" id="pub-cover" required placeholder="https://images.unsplash.com/..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <div class="space-y-2">
                            <label class="block text-sm font-semibold">Synopsis</label>
                            <textarea id="pub-synopsis" rows="3" required placeholder="Brief summary of your story..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                        </div>

                        <div class="border-t border-slate-200 dark:border-slate-800 pt-6 space-y-4">
                            <h3 class="font-bold text-lg">First Chapter</h3>
                            <div class="space-y-2">
                                <label class="block text-sm font-semibold">Chapter Title</label>
                                <input type="text" id="pub-chap-title" required placeholder="Chapter 1: The Beginning" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                            <div class="space-y-2">
                                <label class="block text-sm font-semibold">Chapter Content (Markdown supported)</label>
                                <textarea id="pub-chap-content" rows="8" required placeholder="Type or paste your chapter text here..." class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:ring-2 focus:ring-indigo-500 outline-none font-serif"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-500/30">Publish Story</button>
                    </form>
                </div>
            `;
        }

        // --- Interactivity & Handlers ---
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function navigateChapter(direction) {
            const story = state.stories.find(s => s.id === state.activeStoryId);
            if (!story) return;
            const newIdx = state.activeChapterIdx + direction;
            if (newIdx >= 0 && newIdx < story.chapters.length) {
                state.activeChapterIdx = newIdx;
                render();
            }
        }

        function handlePublish(event) {
            event.preventDefault();
            const newStory = {
                id: 'story-' + Date.now(),
                title: document.getElementById('pub-title').value,
                author: document.getElementById('pub-author').value,
                genre: document.getElementById('pub-genre').value,
                cover: document.getElementById('pub-cover').value,
                synopsis: document.getElementById('pub-synopsis').value,
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                chapters: [
                    {
                        title: document.getElementById('pub-chap-title').value,
                        content: document.getElementById('pub-chap-content').value
                    }
                ]
            };

            state.stories.unshift(newStory);
            router.navigate('reader', newStory.id, 0);
        }

        function openSettingsModal() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 space-y-6 shadow-2xl border border-slate-200 dark:border-slate-800">
                        <div class="flex items-center justify-between">
                            <h3 class="font-bold text-lg">Reader Settings</h3>
                            <button onclick="closeModal()" class="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs font-semibold uppercase text-slate-400 block mb-2">Font Style</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="updateReaderFont('serif')" class="py-2.5 px-4 rounded-xl border ${state.readerSettings.font === 'serif' ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 font-bold' : 'border-slate-200 dark:border-slate-800'} font-serif text-sm">Serif</button>
                                    <button onclick="updateReaderFont('sans')" class="py-2.5 px-4 rounded-xl border ${state.readerSettings.font === 'sans' ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 font-bold' : 'border-slate-200 dark:border-slate-800'} font-sans text-sm">Sans-Serif</button>
                                </div>
                            </div>
                            <div>
                                <label class="text-xs font-semibold uppercase text-slate-400 block mb-2">Text Size</label>
                                <div class="grid grid-cols-3 gap-2">
                                    <button onclick="updateReaderSize('text-base')" class="py-2 rounded-xl border ${state.readerSettings.size === 'text-base' ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 font-bold' : 'border-slate-200 dark:border-slate-800'} text-sm">Normal</button>
                                    <button onclick="updateReaderSize('text-lg')" class="py-2 rounded-xl border ${state.readerSettings.size === 'text-lg' ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 font-bold' : 'border-slate-200 dark:border-slate-800'} text-sm">Large</button>
                                    <button onclick="updateReaderSize('text-xl')" class="py-2 rounded-xl border ${state.readerSettings.size === 'text-xl' ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 font-bold' : 'border-slate-200 dark:border-slate-800'} text-sm">X-Large</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function openChapterSelector(storyId) {
            const story = state.stories.find(s => s.id === storyId);
            if (!story) return;
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[80vh] flex flex-col">
                        <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
                            <h3 class="font-bold text-lg">Table of Contents</h3>
                            <button onclick="closeModal()" class="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="overflow-y-auto space-y-2 flex-1">
                            ${story.chapters.map((ch, idx) => `
                                <button onclick="selectChapter(${idx})" class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-between ${state.activeChapterIdx === idx ? 'bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 font-bold' : ''}">
                                    <span>${ch.title}</span>
                                    <span class="text-xs text-slate-400">Ch. ${idx + 1}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function selectChapter(idx) {
            state.activeChapterIdx = idx;
            closeModal();
            render();
        }

        function updateReaderFont(font) {
            state.readerSettings.font = font;
            render();
            openSettingsModal();
        }

        function updateReaderSize(size) {
            state.readerSettings.size = size;
            render();
            openSettingsModal();
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        // Initial Render
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
